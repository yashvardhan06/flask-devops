replicaCount: 1

image:
  repository: ghcr.io/example/portfolio-app
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 5000

config:
  appEnv: development
  logLevel: info

secret:
  databaseUrl: postgresql://postgres:postgres@postgres:5432/appdb

ingress:
  enabled: true
  className: nginx
  host: dev.portfolio.local

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

namespace: dev
