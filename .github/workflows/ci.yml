name: CI/CD Pipeline

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run lint
        run: |
          python -m compileall .

      - name: Run tests
        run: |
          pytest -q

      - name: Build application package
        run: |
          python -m py_compile app.py

      - name: Build Docker image
        run: |
          docker build -t portfolio-app:${{ github.sha }} .

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Scan Docker image
        run: |
          trivy image --severity HIGH,CRITICAL --exit-code 1 portfolio-app:${{ github.sha }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/portfolio-app:${{ github.sha }}
          docker tag portfolio-app:${{ github.sha }} $IMAGE
          docker push $IMAGE

  deploy:
    needs: build-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.2

      - name: Set up Kubernetes CLI
        uses: azure/setup-kubectl@v4
        with:
          version: v1.30.0

      - name: Create kubeconfig
        run: |
          mkdir -p $HOME/.kube
          printf '%s' "${{ secrets.KUBE_CONFIG }}" | base64 --decode > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Deploy with Helm
        run: |
          helm upgrade --install portfolio-dev ./helm/portfolio-app \
            -f ./helm/portfolio-app/values-dev.yaml \
            --namespace dev \
            --create-namespace \
            --set image.repository=ghcr.io/${{ github.repository_owner }}/portfolio-app \
            --set image.tag=${{ github.sha }}

          helm upgrade --install portfolio-prod ./helm/portfolio-app \
            -f ./helm/portfolio-app/values-prod.yaml \
            --namespace prod \
            --create-namespace \
            --set image.repository=ghcr.io/${{ github.repository_owner }}/portfolio-app \
            --set image.tag=${{ github.sha }}

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/portfolio-app -n dev --timeout=180s
          kubectl rollout status deployment/portfolio-app -n prod --timeout=180s
          kubectl get pods -n dev
          kubectl get pods -n prod

      - name: Smoke test
        run: |
          curl -fsS http://$(kubectl get ingress portfolio-dev-ingress -n dev -o jsonpath='{.status.loadBalancer.ingress[0].ip}')/health || true
          curl -fsS http://$(kubectl get ingress portfolio-prod-ingress -n prod -o jsonpath='{.status.loadBalancer.ingress[0].ip}')/health || true
